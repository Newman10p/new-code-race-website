name: CI

on:
  push:
    branches: [backend, main]
  pull_request:
    branches: [backend, main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-gateway/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image (don't push). Verifies the Dockerfile is valid end-to-end.
      - name: Build ai-gateway image
        uses: docker/build-push-action@v6
        with:
          context: ai-gateway
          push: false
          load: true
          tags: ai-gateway:ci

      # Smoke-test the built image: container must come up and /healthz respond.
      - name: Boot + health check
        run: |
          docker run -d --name gw -p 8000:8000 \
            -e INTERNAL_API_TOKEN="" \
            ai-gateway:ci
          sleep 3
          curl -fsS http://localhost:8000/healthz | tee /tmp/health.json
          python -c "import json,sys; d=json.load(open('/tmp/health.json')); assert d['status']=='ok'; print('healthz OK')"
          docker rm -f gw

  compose-validate:
    name: docker-compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
