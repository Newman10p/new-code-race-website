<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0d" />
    <meta
      name="description"
      content="Lumen — an AI tutor and creative workspace to understand ideas, visualise systems, learn programming and build projects step by step."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css" crossorigin="anonymous" />
    <title>Lumen — Your CodeQuest Learning Companion</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("lumen-appearance") || "{}");
          var mode = s.mode || "dark";
          var light =
            mode === "light" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          var root = document.documentElement;
          if (light) {
            root.classList.add("light");
            root.style.colorScheme = "light";
          } else {
            root.style.colorScheme = "dark";
          }
          if (s.density) root.dataset.density = s.density;
          if (s.fontSize) root.dataset.fontsize = s.fontSize;
          if (s.motion) root.dataset.motion = s.motion;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
